name: GitHub-Profile-3D-Contrib

# Generates the 3D contribution city used in the "3D Contribution" section of README.md.
on:
  schedule:
    # 01:00 WIB (18:00 UTC) every day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D profile images
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): regenerate 3D contribution images"
            git push
          fi
