name: Generate Contribution Snake

# Generates the animated snake SVG used in the "Contribution Snake" section
# of README.md. Output is pushed to the "output" branch.
on:
  # Rebuild the snake every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow running it manually from the Actions tab
  workflow_dispatch:
  # Also rebuild whenever the profile README changes
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}